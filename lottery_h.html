<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>抽選会場</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: #111;    /* 背景色（任意） */
      color: #fff;
    }
    img {
      width: 80%;          /* 画面幅の80% */
      height: auto;
      max-width: 100%;     /* はみ出し防止 */
      display: block;
      margin: 0 auto;      /* 中央寄せ */
    }
    #loading {
      display: none;       /* 初期は非表示 */
      position: fixed;     /* 画面全体に固定 */
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(17,17,17,0.95); /* 半透明背景でオーバーレイ */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;       /* 最前面に表示 */
      text-align: center;
    }
    .spinner {
      width: 80px;
      height: 80px;
      border: 8px solid #ccc;
      border-top: 8px solid #09f;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- ローディング画面 -->
  <div id="loading">
    <div class="spinner"></div>
    <p>✨ お待ちください ✨</p>
  </div>

  <!-- GIFアニメーション -->
  <img id="media" src="images/h.gif" alt="animation">

  <script>
    // 11秒後にロード画面を表示
    setTimeout(() => {
      document.getElementById("media").style.display = "none";   // GIFを非表示
      document.getElementById("loading").style.display = "flex"; // ロード画面表示

      // ロード画面を2秒表示した後に遷移
      setTimeout(() => {
        window.location.href = "result_h.html";
      }, 2000);
    }, 11000);
  </script>
</body>
</html>
